<text x='670.0' y='212.0' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='26' text-anchor='middle' font-weight='normal' fill='#000' xml:space='preserve'>Example: 2001:db8:acad:1::/64</text>
