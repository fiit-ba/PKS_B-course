<text x='50.0' y='360.0' font-family='Liberation Sans, Arial, Helvetica, sans-serif' font-size='26' text-anchor='start' font-weight='normal' fill='#000' xml:space='preserve'>The first 3 bits (red) are 001, so the first hextet is 2000 to 3fff:</text>
<text x='70.0' y='404.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='bold' fill='#e11919' xml:space='preserve'>001</text>
<text x='113.2' y='404.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='normal' fill='#000' xml:space='preserve'>0 0000 0000 0000</text>
<text x='372.4' y='404.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='normal' fill='#000' xml:space='preserve'>= 2000</text>
<text x='70.0' y='444.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='bold' fill='#e11919' xml:space='preserve'>001</text>
<text x='113.2' y='444.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='normal' fill='#000' xml:space='preserve'>1 1111 1111 1111</text>
<text x='372.4' y='444.0' font-family='Liberation Mono, Courier New, monospace' font-size='24' text-anchor='start' font-weight='normal' fill='#000' xml:space='preserve'>= 3fff</text>
